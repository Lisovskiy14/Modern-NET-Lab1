version: '3.8'
services:

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab1-net
    depends_on:
      - app

  app:
    build: ./app
    image: lab1-app:1.0
    container_name: app
    networks:
      - lab1-net
    depends_on:
       - db

  db:
    image: redis:7-alpine
    container_name: db
    networks:
      - lab1-net

networks:
  lab1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
